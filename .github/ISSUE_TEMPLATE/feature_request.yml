name: Feature request / 功能建议
description: Suggest an idea or improvement / 提出新想法或改进
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case / 要解决的问题
      description: What are you trying to do, and what gets in the way? / 你想做什么,遇到了什么阻碍?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution / 期望的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 已考虑的替代方案
  - type: textarea
    id: context
    attributes:
      label: Additional context / 补充信息
      description: Languages involved, example code, screenshots. / 涉及的语言、示例代码、截图。
