name: Bug report / 问题反馈
description: Something is not working as expected / 功能不符合预期
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened? / 发生了什么
      description: Describe the problem and what you expected instead. / 描述问题以及你期望的结果。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      placeholder: |
        1. Open a file with ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Code sample / 示例代码
      description: A minimal snippet that triggers the problem (leave out anything private). / 能触发问题的最小代码片段(请去掉敏感内容)。
      render: text
  - type: dropdown
    id: area
    attributes:
      label: Area / 功能范围
      options:
        - Editor inspection / quick fix
        - Inspect All Files (tool window)
        - Scan automatically after the project opens
        - Settings page
        - Other
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language of the file / 文件语言
      multiple: true
      options:
        - Java
        - Kotlin
        - JavaScript / TypeScript
        - Python
        - PHP
        - Dart
        - HTML
        - CSS
        - XML
        - JSON
        - Other
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version / 插件版本
      placeholder: "0.6.0"
    validations:
      required: true
  - type: dropdown
    id: ide
    attributes:
      label: IDE / 使用的 IDE
      options:
        - IntelliJ IDEA
        - IntelliJ IDEA Community
        - PyCharm
        - PyCharm Community
        - WebStorm
        - PhpStorm
        - GoLand
        - CLion
        - RubyMine
        - RustRover
        - Rider
        - DataGrip
        - DataSpell
        - Android Studio
        - MPS
        - JetBrains Gateway
        - JetBrains Client
        - Code With Me Guest
    validations:
      required: true
  - type: input
    id: ide-version
    attributes:
      label: IDE build / IDE 版本
      description: Help | About, e.g. 2025.3.1 (Build #IU-253.xxxx) / 见 Help | About
      placeholder: "2025.3.1 (Build #IU-253.12345.67)"
    validations:
      required: true
  - type: input
    id: settings
    attributes:
      label: Inspect / Quick fix glyph settings / 字形设置
      placeholder: "Inspect: Simplified, Quick fix: HongKong"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots / 日志或截图
      description: Relevant lines from idea.log (Help | Show Log in Finder/Explorer), or screenshots. / idea.log 中的相关内容或截图。
